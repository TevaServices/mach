# Release pipeline for mach.
#
# Trigger: push a tag named v* (e.g. `git tag v0.3.0 && git push origin v0.3.0`).
#
# What it publishes, on the GitHub release for that tag:
#   - the mach client (agent + console) for linux/darwin/windows on amd64/arm64
#   - mach-attestations.intoto.jsonl — one in-toto attestation bundle, a DSSE
#     envelope per line (one per binary). Each statement carries its binary's
#     sha256, so the bundle is the release's signed integrity record; before it
#     is assembled, every envelope is checked against the binary it names.
#     Envelopes are made with `mach-server attest` and re-verified per matrix
#     leg — a build from a dirty tree or with no VCS revision fails the release.
#   - the signing key's public half (hex ed25519) in the release notes
# and to GHCR: multi-arch (linux/amd64 + linux/arm64) mach-server and
# mach-agent containers.
#
# Signing: attestations are signed with an ed25519 key supplied through the
# MACH_RELEASE_SIGNING_KEY secret (hex-encoded private key; generate one with
# scripts/gen-release-key.sh). Without that secret the release FAILS rather
# than shipping unattested binaries — the same rule the server applies to an
# unreadable policy file: refusing to start is better than starting silently
# unguarded. The key is a release/audit control; a live control plane
# re-attests with its own identity key (see the Dockerfile footer).
#
# VCS stamping matters here: Go embeds the revision and dirty flag in each
# binary, `mach-server attest` reads it back, and push-update --attestation
# refuses a modified-tree build. Actions/checkout leaves a clean tree, and
# .git must reach the Docker build (the Dockerfile explains why there is no
# .dockerignore excluding it).
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  # Gate: the tagged commit must pass lint and the unit tests. CI covers
  # main; this keeps a tag cut from an untested commit from shipping.
  gate:
    name: lint + test (tagged commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run lint
      - run: mise run test

  binaries:
    name: client ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: linux,   goarch: amd64}
          - {goos: linux,   goarch: arm64}
          - {goos: darwin,  goarch: amd64}
          - {goos: darwin,  goarch: arm64}
          - {goos: windows, goarch: amd64, ext: ".exe"}
          - {goos: windows, goarch: arm64, ext: ".exe"}
    env:
      CGO_ENABLED: "0"
      MACH_SERVER_KEY: "signing.key"
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: Build
        run: |
          mkdir -p dist
          # The tag is the only version source in this workflow: this same VER
          # stamps the binary and is handed to `attest` below, so the artifact
          # and the attestation that describes it cannot disagree.
          VER="${GITHUB_REF_NAME#v}"
          LDFLAGS="-s -w -X github.com/bcross/mach/internal/version.Version=$VER"
          go build -trimpath -ldflags "$LDFLAGS" \
            -o "dist/mach-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" ./cmd/mach
          # attest/verify-attestation live in mach-server; a native copy is
          # all this job needs it for (the container job builds the image).
          go build -trimpath -ldflags "$LDFLAGS" -o dist/mach-server ./cmd/mach-server

      - name: Write release signing key
        env:
          KEY: ${{ secrets.MACH_RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Secret MACH_RELEASE_SIGNING_KEY is not set."
            echo "::error::Generate one with scripts/gen-release-key.sh and add it as a"
            echo "::error::repository secret. Release binaries are not published unattested."
            exit 1
          fi
          printf '%s' "$KEY" > signing.key
          chmod 600 signing.key

      - name: Attest
        run: |
          VER="${GITHUB_REF_NAME#v}"
          BIN="mach-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          dist/mach-server attest "dist/$BIN" "$VER" --out "dist/$BIN.intoto.jsonl"

      # verify-attestation checks the signature against the key we just signed
      # with and the subject digest against the file on disk; exit 0 with a
      # WARNING means a modified-tree or VCS-less build, which must not ship.
      # (Captured and compared rather than piped to grep -q: with pipefail a
      # grep that exits early SIGPIPEs the writer and reads as failure — see
      # the working note in AGENTS.md.)
      - name: Verify attestation (and refuse a dirty or untraceable build)
        run: |
          BIN="mach-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          out=$(dist/mach-server verify-attestation "dist/$BIN.intoto.jsonl" "dist/$BIN") || exit 1
          echo "$out"
          if echo "$out" | grep -q "WARNING"; then
            echo "::error::attestation reports a warning (modified tree or missing VCS revision) — refusing to publish this build"
            exit 1
          fi

      - name: Derive the signing key's public half
        run: |
          # ed25519.PrivateKey is seed(32) || pub(32); the last 64 hex chars
          # are the public key. It is what a verifier checks DSSE against.
          awk '{print substr($0, length($0)-63)}' signing.key > dist/mach-release-signing-key.pub

      # Only the client binary, its attestation and the pubkey file are
      # published — the `mach-server` built above is this job's tool, not a
      # release artifact, so the glob here stops at the client's own name.
      - uses: actions/upload-artifact@v4
        with:
          name: client-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/mach-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}*
            dist/mach-release-signing-key.pub

  container:
    name: multi-arch server image (ghcr)
    runs-on: ubuntu-latest
    needs: gate
    outputs:
      image: ${{ steps.meta.outputs.image }}
      version: ${{ steps.meta.outputs.version }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: |
          # Owner name lowercased for GHCR (repository_owner is not guaranteed to be).
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=${owner}/mach-server" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Builds the existing Dockerfile per platform. .git stays in the build
      # context so Go stamps the VCS revision into the binaries it compiles
      # (see the Dockerfile header; there is deliberately no .dockerignore
      # excluding it). Note: the agent binaries baked into the image are not
      # attested — push-update --attestation covers runtime pushes only.
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # Stamps mach-server and the six agent binaries baked into the image,
          # so the GHCR tag, the OCI version label and `mach-server version`
          # inside the container all report the same release for the first time.
          build-args: |
            MACH_VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ghcr.io/${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.title=mach-server
            org.opencontainers.image.description=mach control plane
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  agent-container:
    name: multi-arch agent image (ghcr)
    runs-on: ubuntu-latest
    needs: gate
    outputs:
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=${owner}/mach-agent" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # The agent container is built from Dockerfile.agent (see its header for
      # why pushed updates are refused inside it). Same MACH_VERSION stamp as
      # the server image, so `mach version` in either container and the GHCR
      # tags all report the same release.
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.agent
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            MACH_VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ghcr.io/${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.title=mach-agent
            org.opencontainers.image.description=mach agent (outbound-only daemon)
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  release:
    name: publish GitHub release
    runs-on: ubuntu-latest
    needs: [binaries, container, agent-container]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Assemble the attestation bundle and release body
        run: |
          cd dist
          PUB=$(cat mach-release-signing-key.pub)
          rm mach-release-signing-key.pub
          # One attestation bundle in the in-toto bundle layout: newline-
          # delimited JSON, one DSSE envelope per line. Each statement carries
          # the sha256 of the binary it names, so the bundle is the signed
          # integrity record and no separate checksum file is needed. Verify
          # each envelope against its binary while assembling: a signed
          # statement describing the wrong bytes must not ship.
          n=0
          for f in mach-*.intoto.jsonl; do
            jq -c . "$f" >> ../bundle.jsonl
            name=$(jq -r '.payload | @base64d | fromjson | .subject[0].name' "$f")
            dig=$(jq -r '.payload | @base64d | fromjson | .subject[0].digest.sha256' "$f")
            actual=$(sha256sum "$name" | cut -d' ' -f1)
            if [ "$dig" != "$actual" ]; then
              echo "::error::$f names $name at sha256 $dig, but the binary hashes to $actual"
              exit 1
            fi
            rm "$f"
            n=$((n+1))
          done
          if [ "$n" != 6 ]; then
            echo "::error::expected 6 attestations, collected $n"
            exit 1
          fi
          mv ../bundle.jsonl mach-attestations.intoto.jsonl
          cat > ../release-body.md <<EOF
          **Container images** (linux/amd64 + linux/arm64):
          - \`ghcr.io/${{ needs.container.outputs.image }}:${{ needs.container.outputs.version }}\` (also \`:latest\`) — the control plane; image digest \`${{ needs.container.outputs.digest }}\`
          - \`ghcr.io/${{ needs.agent-container.outputs.image }}:${{ needs.container.outputs.version }}\` (also \`:latest\`) — the outbound-only agent, for machines that run as containers; image digest \`${{ needs.agent-container.outputs.digest }}\`. Enrolls headlessly from \`MACH_SERVER\` / \`MACH_API_KEY\` / \`MACH_NAME\` and state lives entirely in the \`/data\` volume; pushed updates are refused inside it (see Dockerfile.agent) — update by pulling the next image.

          **Client:** the mach binary (agent + console) for linux / darwin / windows, amd64 + arm64.

          **Attestations:** \`mach-attestations.intoto.jsonl\` is one in-toto attestation bundle — a DSSE envelope per line, one per binary. Each statement carries its binary's sha256, the toolchain and build flags, the module graph and the VCS revision, so the bundle is the release's signed integrity record. Verify with any DSSE-aware tool against this release's ed25519 public key (hex; each envelope names its sha256-derived keyid): \`$PUB\`. \`mach-server verify-attestation\` reads one envelope per file — extract the line for the binary you are checking.

          **Note:** the darwin and windows binaries are not code-signed (no signing certificate in this pipeline).
          EOF

      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-body.md
          generate_release_notes: true
          files: |
            dist/mach-*