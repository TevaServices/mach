# CI: lint + unit tests + e2e on pushes to main and on every PR.
# Runs the same mise tasks the repo documents (mise.toml), so the suite CI
# runs is the suite AGENTS.md describes.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # DCO: every commit on a PR must carry a Signed-off-by line matching
  # its author or committer (CONTRIBUTING.md). Merge commits are exempt
  # (their parents carry their own sign-offs), and so is dependabot,
  # which cannot sign off.
  dco:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require Signed-off-by on every commit
        run: |
          set -u
          fail=0
          for c in $(git rev-list "origin/${{ github.base_ref }}..HEAD"); do
            if [ "$(git rev-list --parents -n1 "$c" | wc -w)" -gt 2 ]; then
              continue
            fi
            author=$(git show -s --format='%an <%aE>' "$c")
            committer=$(git show -s --format='%cn <%cE>' "$c")
            body=$(git show -s --format='%B' "$c")
            if ! printf '%s\n' "$body" | grep -qxF "Signed-off-by: $author" \
            && ! printf '%s\n' "$body" | grep -qxF "Signed-off-by: $committer"; then
              echo "::error::DCO: commit $(git show -s --format='%h %s' "$c") lacks 'Signed-off-by: $author'"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "Every commit needs a 'Signed-off-by:' line matching its author. Use 'git commit -s' — see CONTRIBUTING.md."
          fi
          exit "$fail"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: mise run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: mise run test

  # Windows parity for the unit tests: the agent has Windows-only service
  # code (the MSI's machd entry point), and several suites carried POSIX-only
  # assertions (file modes, umask, /bin/sh) that were made to run there — this
  # job keeps the Windows build and its tests honest on every PR. The e2e
  # suite stays a Linux job (bash harness + unix confinement); the MSI smoke
  # below covers the Windows package end to end.
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test ./...

  # The MSI authoring has no linux compile path (wix.exe is windows-only and
  # the release pipeline only exercises it on a tag) — that is how a v3-ism
  # survived until the FIRST tag through the new pipeline (v0.8.0 run,
  # WIX0005, #49), and how an unterminated condition quote reached THREE
  # releases that all died at the first real install (#54). So this smoke is
  # more than a compile: it builds the REAL agent (the service must speak the
  # SCM protocol or the start fails 1920 — a stub cannot), installs the MSI
  # on the runner, checks the machd service (installed, running = the
  # idling-until-enrollment service, auto-start, restart-on-failure
  # configured, binary path right), and uninstalls it — the exact class of
  # failure every burned tag hit, now caught on the PR.
  wix-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # On PRs, run only when the authoring (or this job) changed: a docs PR
      # should not pay a Windows runner for a WiX compile. On main pushes it
      # always runs — main touching packaging/wix without a smoke build is
      # exactly the drift this guards against.
      - name: Did the MSI authoring change?
        id: wxs
        shell: bash
        run: |
          set -u
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            n=$(git diff --name-only "$base"...HEAD -- packaging/wix/mach.wxs | wc -l)
          else
            n=1
          fi
          echo "changed=$n" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v6
        if: steps.wxs.outputs.changed != '0'
        with:
          go-version-file: go.mod

      - name: Build the agent binary the MSI embeds
        if: steps.wxs.outputs.changed != '0'
        shell: pwsh
        run: go build -trimpath -o mach-smoke.exe ./cmd/mach

      - name: Install, service, uninstall (WiX 5.0.2)
        if: steps.wxs.outputs.changed != '0'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix build -arch x64 `
            -define Version=0.0.0-smoke `
            -define MachExeSource=mach-smoke.exe `
            packaging/wix/mach.wxs -o mach-smoke.msi
          if ($LASTEXITCODE -ne 0) { Write-Error 'wix build failed'; exit 1 }

          $iLog = Join-Path (Get-Location) 'msi-log-smoke-install.txt'
          $uLog = Join-Path (Get-Location) 'msi-log-smoke-uninstall.txt'
          function DumpLogTail($path) {
            if (Test-Path $path) { Get-Content $path -Tail 200 }
          }

          $p = Start-Process msiexec -ArgumentList "/i","`"$PWD\mach-smoke.msi`"","/quiet","/norestart","/l*v","`"$iLog`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            DumpLogTail $iLog; Write-Error "smoke install failed: exit $($p.ExitCode)"; exit 1
          }
          $q = sc.exe query machd
          if ($LASTEXITCODE -ne 0 -or -not ($q | Select-String -Pattern '4  RUNNING')) {
            DumpLogTail $iLog; Write-Error "machd not installed+running: $($q | Out-String)"; exit 1
          }
          $qc = sc.exe qc machd
          if (-not ($qc | Select-String -SimpleMatch 'mach-smoke.exe" service') -or
              -not ($qc | Select-String -SimpleMatch 'AUTO_START')) {
            DumpLogTail $iLog; Write-Error "machd config wrong: $($qc | Out-String)"; exit 1
          }
          if (-not ((sc.exe qfailure machd) | Select-String -SimpleMatch 'RESTART')) {
            DumpLogTail $iLog; Write-Error "machd has no restart-on-failure action"; exit 1
          }

          $p2 = Start-Process msiexec -ArgumentList "/x","`"$PWD\mach-smoke.msi`"","/quiet","/norestart","/l*v","`"$uLog`"" -Wait -PassThru
          if ($p2.ExitCode -ne 0) {
            DumpLogTail $uLog; Write-Error "smoke uninstall failed: exit $($p2.ExitCode)"; exit 1
          }
          $null = sc.exe query machd
          if ($LASTEXITCODE -eq 0) { DumpLogTail $uLog; Write-Error 'machd service survived uninstall'; exit 1 }
          if (Test-Path "$env:ProgramFiles\mach\mach-smoke.exe") {
            Write-Error 'mach-smoke.exe survived uninstall'; exit 1
          }
          # exit 0 explicitly, not implicitly: the runner takes the trailing
          # $LASTEXITCODE as the step's status, and the step's LAST native call
          # is the query that EXPECTED to fail (sc.exe query after uninstall
          # exits 1060).
          "smoke install + service + uninstall OK"; exit 0

      - name: Upload the smoke logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: msi-smoke-logs
          path: msi-log-smoke-*.txt

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: |
          set -o pipefail
          mise run e2e | tee /tmp/e2e.log
      # The Testing rule makes AGENTS.md's count line load-bearing ("Green =
      # N checks", updated by every PR that adds or removes checks) — so it
      # is asserted against the suite's own result here, not left to the
      # reviewer's round-1 pass. Observed twice that unguarded number
      # costing a review round (and, when two PRs in flight each bumped it,
      # a CONFLICTING merge): a red job now, catchable before handoff.
      - name: AGENTS.md count matches the suite
        run: |
          n=$(grep -oE 'e2e: [0-9]+ passed' /tmp/e2e.log | grep -oE '[0-9]+' | tail -1)
          declared=$(grep -cE 'Green = [0-9]+ checks' AGENTS.md)
          if [ "$declared" -ne 1 ]; then
            echo "::error::AGENTS.md must carry exactly one 'Green = N checks' line (found $declared), and the Testing rule's update note must not embed a number"
            exit 1
          fi
          want=$(grep -oE 'Green = [0-9]+ checks' AGENTS.md | grep -oE '[0-9]+')
          if [ "$n" != "$want" ]; then
            echo "::error::count drift: e2e ran $n checks, AGENTS.md says Green = $want checks. Update AGENTS.md in the same commit that added/removed checks."
            exit 1
          fi
          echo "count ok: $n == AGENTS.md"