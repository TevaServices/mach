# The control plane container also carries machctl as its entrypoint, so
# `docker compose run --rm mach add-api-key ...` works against the same DB.

services:
  mach:
    build: .
    image: mach-controlplane:latest
    container_name: mach
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"   # put Caddy/nginx TLS in front for public exposure
    volumes:
      - ./data:/data
    command: ["serve", "--listen", ":8080", "--public-url", "${MACH_PUBLIC_URL}"]