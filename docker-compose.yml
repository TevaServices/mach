# Control plane container. Admin commands against the same DB:
#   docker compose run --rm mach-server add-api-key <name> <key>

services:
  mach-server:
    build:
      context: .
      # Stamps mach-server and all six baked agents with the release version:
      #   MACH_VERSION=0.3.0 docker compose up -d --build
      # Left unset (the default), the image reports the compiled-in "devel".
      args:
        MACH_VERSION: ${MACH_VERSION:-}
    image: mach-controlplane:latest
    container_name: mach-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"   # put Caddy/nginx TLS in front for public exposure
    volumes:
      - ./data:/data
    environment:
      MACH_PUBLIC_URL: ${MACH_PUBLIC_URL}
      MACH_LISTEN: ":8080"
      # Web UI (optional). All three of the OIDC variables or none: with none the
      # /ui routes are not registered, and a partial set is a startup error naming
      # what is missing rather than a silently absent admin surface.
      MACH_OIDC_ISSUER: ${MACH_OIDC_ISSUER:-}
      MACH_OIDC_CLIENT_ID: ${MACH_OIDC_CLIENT_ID:-}
      MACH_OIDC_CLIENT_SECRET: ${MACH_OIDC_CLIENT_SECRET:-}
      MACH_OIDC_REDIRECT_URL: ${MACH_OIDC_REDIRECT_URL:-}
      # Empty means ANY identity the issuer verifies may manage the fleet. Set it
      # unless that is what you mean.
      MACH_OIDC_ALLOWED_DOMAINS: ${MACH_OIDC_ALLOWED_DOMAINS:-}

  # An agent on a machine that runs as a container. Enrolls headlessly on
  # first start; identity and config live in the mounted volume, so restarts
  # reconnect instead of re-enrolling. The enroll key is read once and can be
  # revoked afterwards. MACH_POLICY (the machine's own command policy) passes
  # through as an ordinary environment variable.
  # mach-agent:
  #   image: mach-agent:latest        # or ghcr.io/<owner>/mach-agent
  #   restart: unless-stopped
  #   volumes:
  #     - ./data/agent:/data
  #   environment:
  #     MACH_SERVER: https://mach.example.com
  #     MACH_API_KEY: <enroll-scoped key, read once at enrollment>
  #     MACH_NAME: acme-container-1     # org-prefixed
  #     # MACH_POLICY: |                # the machine's own block list
  #     #   deny:rm -rf