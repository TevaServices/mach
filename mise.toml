# mise.toml — dependencies, build, test, e2e for the mach repo.
# Usage: mise run build | mise run test | mise run e2e | mise run all
# Requires mise: https://mise.jdx.dev (curl https://mise.run | sh)

[tools]
go = "1.24"
jq = "1.7"
curl = "latest"

[env]
CGO_ENABLED = "0"
MACH_TEST_PORT = "8099"
MACH_TEST_ORG = "bcross"

[tasks.deps]
description = "Verify toolchain and download Go modules"
run = "go mod download"

[tasks.build]
description = "Build mach and mach-server into bin/"
run = "mkdir -p bin && CGO_ENABLED=0 go build -o bin/mach ./cmd/mach && CGO_ENABLED=0 go build -o bin/mach-server ./cmd/mach-server && echo built: bin/mach bin/mach-server"

[tasks.build-all]
description = "Cross-compile all supported OS/arch targets into bin/cross/"
run = '''
mkdir -p bin/cross
for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
  os=${t%/*}; arch=${t#*/}; ext=""
  [ "$os" = windows ] && ext=.exe
  CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -o bin/cross/mach-$os-$arch$ext ./cmd/mach
done
ls bin/cross
'''

[tasks.test]
description = "Run unit tests (all packages, race + cover)"
run = "go test ./... -v -race -coverprofile=coverage.out"

[tasks.lint]
description = "go vet across the tree"
run = "go vet ./..."

[tasks.e2e]
description = "End-to-end test: spins up control plane + agents on 127.0.0.1 (script builds its own binaries)"
run = "bash scripts/e2e.sh"

[tasks.dev]
description = "Run the control plane locally after 'mise run build' (pass MACH_PUBLIC_URL if not local)"
run = '''
MACH_DB=./data/mach.db MACH_LISTEN=127.0.0.1:8080
MACH_PUBLIC_URL=${MACH_PUBLIC_URL:-http://127.0.0.1:8080}
MACH_ORG=${MACH_ORG:-mach} ./bin/mach-server serve
'''

[tasks.all]
description = "deps, lint, build, cross-compile, unit tests, e2e"
depends = ["deps", "lint", "build", "build-all", "test", "e2e"]