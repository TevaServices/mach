# mise.toml — dependencies, build, fmt, test, e2e for the mach repo.
# Usage: mise run build | mise run fmt | mise run lint | mise run test | mise run e2e | mise run all
# Requires mise: https://mise.jdx.dev (curl https://mise.run | sh)

[tools]
go = "1.26"
jq = "1.7"

[env]
CGO_ENABLED = "0"
MACH_TEST_PORT = "8099"
MACH_TEST_ORG = "bcross"

[tasks.deps]
description = "Verify toolchain and download Go modules"
run = "go mod download"

[tasks.build]
description = "Build mach and mach-server into bin/ (stamp a release with MACH_VERSION=0.3.0)"
run = '''
mkdir -p bin
# Unset means no -X at all, never an empty one: an empty stamp would make every
# binary report nothing, and would make every agent look skewed in the fleet
# view. `go build -ldflags ""` is a legal no-op, so the flag is passed either way.
X=""
if [ -n "${MACH_VERSION:-}" ]; then
  X="-X github.com/bcross/mach/internal/version.Version=$MACH_VERSION"
fi
CGO_ENABLED=0 go build -ldflags "$X" -o bin/mach ./cmd/mach
CGO_ENABLED=0 go build -ldflags "$X" -o bin/mach-server ./cmd/mach-server
echo "built: bin/mach bin/mach-server"
'''

[tasks.build-all]
description = "Cross-compile all supported OS/arch targets into bin/cross/"
run = '''
mkdir -p bin/cross
X=""
if [ -n "${MACH_VERSION:-}" ]; then
  X="-X github.com/bcross/mach/internal/version.Version=$MACH_VERSION"
fi
for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
  os=${t%/*}; arch=${t#*/}; ext=""
  [ "$os" = windows ] && ext=.exe
  CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -ldflags "$X" -o bin/cross/mach-$os-$arch$ext ./cmd/mach
done
ls bin/cross
'''

[tasks.test]
description = "Run unit tests (all packages, race + cover)"
run = "go test ./... -v -race -coverprofile=coverage.out"

[tasks.fmt]
description = "Format every Go file in the tree (writes them)"
run = "gofmt -w ."

[tasks.fmt-check]
description = "Fail if any Go file is not gofmt-clean (read-only; use 'mise run fmt' to fix)"
run = '''
out=$(gofmt -l .)
if [ -n "$out" ]; then
  echo "gofmt found files that need formatting:"
  echo "$out"
  echo "run: mise run fmt"
  exit 1
fi
echo "gofmt: clean"
'''

[tasks.lint]
description = "gofmt check plus go vet across the tree (read-only: never rewrites files)"
depends = ["fmt-check"]
run = "go vet ./..."

[tasks.e2e]
description = "End-to-end test: spins up control plane + agents on 127.0.0.1 (script builds its own binaries)"
run = "bash scripts/e2e.sh"

[tasks.attest]
description = "Cross-compile the agents and write a signed in-toto attestation for each (uses the control plane's identity key: MACH_DB/MACH_SERVER_KEY)"
run = '''
set -e
# One variable drives both the stamp and the attestation argument, so the
# version a binary reports and the version its attestation claims can never
# drift apart. This task builds release artifacts, which is why its default is
# release-shaped rather than the compiled-in "devel"; a real release sets
# MACH_VERSION from the tag.
VER="${MACH_VERSION:-0.2.0}"
mkdir -p bin/cross bin/attestations
for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
  os=${t%/*}; arch=${t#*/}; ext=""
  [ "$os" = windows ] && ext=.exe
  out="bin/cross/mach-$os-$arch$ext"
  CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
    -ldflags="-s -w -X github.com/bcross/mach/internal/version.Version=$VER" -o "$out" ./cmd/mach
  ./bin/mach-server attest "$out" "$VER" --out "bin/attestations/mach-$os-$arch$ext.intoto.jsonl"
done
ls bin/attestations
'''

[tasks.dev]
description = "Run the control plane in the foreground on the local playground's data (see local:up)"
run = "scripts/localdev.sh foreground"

# The local playground: one control plane and this host enrolled as an agent of
# it, both under data/local/. See scripts/localdev.sh — its header explains what
# it does and does not touch. The subcommands live in that script rather than
# here because mise cannot forward arguments to a task.
[tasks."local:up"]
description = "Build, start a local control plane (LAN-reachable, web UI on), enroll this host, start the agent"
run = "scripts/localdev.sh up"

[tasks."local:server"]
description = "Build and start a local control plane only — nothing enrolled, no keys minted (MACH_LOCAL_HOST=127.0.0.1 to keep it off the network)"
run = "scripts/localdev.sh server"

[tasks."local:enroll"]
description = "Enroll this host by hand: prints the QR and challenge code and waits for approval (reuses the running server's host)"
run = "scripts/localdev.sh enroll"

[tasks."local:reset"]
description = "Stop the playground and wipe it back to a fresh install (deletes data/local/)"
run = "scripts/localdev.sh reset"

[tasks."local:down"]
description = "Stop the local playground's agent, control plane and fake identity provider (data is kept)"
run = "scripts/localdev.sh down"

[tasks."local:status"]
description = "Fleet listing from the local playground, through the console CLI"
run = "scripts/localdev.sh status"

[tasks."local:logs"]
description = "Follow the local playground's control-plane, agent and fake-IdP logs"
run = "scripts/localdev.sh logs"

[tasks."local:mach"]
description = "Run the mach CLI against the local playground: mise run local:mach -- exec MACHINE 'cmd'"
run = "scripts/localdev.sh mach"

[tasks.all]
description = "deps, lint (incl. the gofmt check), build, cross-compile, unit tests, e2e"
depends = ["deps", "lint", "build", "build-all", "test", "e2e"]